name: repository-gates

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate repository gates
        run: python tools/validate_project_gates.py

      - name: Configure CMake
        run: cmake -S . -B build

      - name: Build bootstrap targets
        run: cmake --build build --config Release

      - name: Run placeholder tests
        run: ctest --test-dir build --output-on-failure --build-config Release
