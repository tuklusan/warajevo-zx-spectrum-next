name: Private game Fuse screen comparison

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Fetch selected private game on the runner
        run: git lfs pull --include='test-media/Abu Simbel Profanation.tap' --exclude=''

      - name: Install product and pinned Fuse build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes autoconf automake build-essential bison gettext \
            flex libbz2-dev libglib2.0-dev libgcrypt20-dev libpng-dev \
            libtool libxml2-dev pkg-config zlib1g-dev \
            libasound2-dev libgl-dev libgtk-3-dev libxcursor-dev libxi-dev \
            libx11-dev xvfb ninja-build python3-pil tesseract-ocr

      - name: Build the pinned Fuse reference
        run: bash ci/test/fuse-visual-equivalence/capture-reference.sh

      - name: Capture Fuse after automatic private game load
        shell: bash
        run: |
          mkdir -p dist/private-game-fuse/reference
          export LD_LIBRARY_PATH="$RUNNER_TEMP/wzsn-fuse-visual/install/lib:$RUNNER_TEMP/wzsn-fuse-visual/install/lib64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          timeout --signal=TERM 240s "$RUNNER_TEMP/wzsn-fuse-visual/install/bin/fuse" \
            --machine 48 --rom-48 roms/48.rom --no-sound \
            --tape 'test-media/Abu Simbel Profanation.tap' --auto-load \
            --automation-output dist/private-game-fuse/reference \
            --automation-frames 3000 --automation-capture-screen
          test -s dist/private-game-fuse/reference/screen.png

      - name: Build production Linux desktop host
        run: |
          cmake -S src/cmake -B dist/private-game-fuse/product -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DWZSN_BUILD_SOKOL_HOST=ON
          cmake --build dist/private-game-fuse/product --clean-first --parallel 2

      - name: Observe private game and compare screen pixels
        run: |
          mkdir -p dist/private-game-fuse/temp
          TMPDIR="$PWD/dist/private-game-fuse/temp" xvfb-run -a python3 \
            ci/test/private-game-smoke.py \
            --binary dist/private-game-fuse/product/Warajevo-ZX-Spectrum-Next \
            --rom roms/48.rom \
            --tape 'test-media/Abu Simbel Profanation.tap' \
            --fuse-reference dist/private-game-fuse/reference/screen.png \
            --proof dist/private-game-fuse/observation.json

      - name: Upload aggregate metrics only
        uses: actions/upload-artifact@v4
        with:
          name: private-game-fuse-metrics-${{ github.sha }}
          path: dist/private-game-fuse/observation.json
          if-no-files-found: error
