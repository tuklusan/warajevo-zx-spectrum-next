name: GUI menu groups

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  menu-groups:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install desktop and OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev libasound2-dev libgl1-mesa-dev \
            libxi-dev libxcursor-dev xvfb xdotool imagemagick tesseract-ocr \
            python3-pil
      - name: Build the production desktop host
        run: |
          cmake -S src/cmake -B dist/gui-menu-groups/product -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DWZSN_BUILD_SOKOL_HOST=ON
          cmake --build dist/gui-menu-groups/product --config Release \
            --target wz_sokol_host --parallel 2
      - name: Verify canonical menu groups and fixed-action dispatch
        run: |
          xvfb-run -a python3 ci/test/gui-menu-groups.py \
            --binary dist/gui-menu-groups/product/Warajevo-ZX-Spectrum-Next \
            --rom roms/48.rom \
            --proof dist/gui-menu-groups/proof.json
      - name: Upload proof and menu captures
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gui-menu-groups-proof
          path: |
            dist/gui-menu-groups/proof.json
            dist/gui-menu-groups/*.png
          if-no-files-found: error
          retention-days: 1
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gui-menu-groups-diagnostic
          path: |
            dist/gui-menu-groups/*.png
            dist/gui-menu-groups/application.log
          if-no-files-found: warn
          retention-days: 1
