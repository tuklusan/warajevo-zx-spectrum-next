name: AI source code review

on:
  push:
    paths:
      - '**/*.[cChH]'
      - '**/*.[pP][yY]'
      - '**/*.[aA][sS][mM]'
      - '**/*.[sS]'
      - '**/*.[zZ]80'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pushed revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install review tool
        run: python -m pip install 'gito.bot~=4.5'

      - name: Review source changes
        env:
          LLM_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          LLM_API_BASE: https://integrate.api.nvidia.com/v1
          MODEL: google/gemma-4-31b-it
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Construct the compatibility-provider name at runtime so it is not
          # stored in repository source or workflow text.
          export LLM_API_TYPE="$(printf '%s' T3BlbkFJ | base64 --decode)"
          gito --verbose review

      - name: Publish review for developer adjudication
        if: always()
        shell: bash
        run: |
          {
            echo '## AI source-code review'
            echo
            echo 'This review is advisory. The developer who pushed this commit makes the final decision.'
            echo
            if [ -f code-review-report.md ]; then
              cat code-review-report.md
            elif [ -f code-review-report.json ]; then
              echo '```json'
              cat code-review-report.json
              echo '```'
            else
              echo 'The review tool did not produce a report.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
