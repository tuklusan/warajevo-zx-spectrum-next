name: ULA fetch trace contract

on:
  push:
    branches: [main]
    paths:
      - 'src/**/*.c'
      - 'src/**/*.h'
      - 'src/**/*.m'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ula-fetch-trace:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows Intel
            id: windows-x64
            label: windows-2025
          - name: Windows ARM
            id: windows-arm64
            label: windows-11-arm
          - name: macOS Intel
            id: macos-x64
            label: macos-15-intel
          - name: macOS ARM
            id: macos-arm64
            label: macos-15
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.label }}
    steps:
      - name: Check out exact main revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Configure ULA fetch trace contract
        run: >-
          cmake -S ci/test/ula-fetch-trace
          -B dist/ula-fetch-trace
          -DCMAKE_BUILD_TYPE=Debug

      - name: Build production trace dumper and ULA fixture
        run: >-
          cmake --build dist/ula-fetch-trace --config Debug
          --target wz_trace_dump wz_ula_fetch_trace_fixture --parallel 2

      - name: Run ULA fetch trace contract
        run: >-
          ctest --test-dir dist/ula-fetch-trace -C Debug
          --output-on-failure --verbose
          -R '^wz_ula_fetch_trace_contract$'

      - name: Write pinned hosted proof
        shell: bash
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
          RUNNER_NAME: ${{ matrix.name }}
        run: |
          if command -v python3 >/dev/null 2>&1; then python_bin=python3; else python_bin=python; fi
          "$python_bin" ci/test/ula-fetch-trace/write-proof.py \
            --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --runner "$RUNNER_NAME/$RUNNER_OS/$RUNNER_ARCH" \
            --run-log dist/ula-fetch-trace/Testing/Temporary/LastTest.log \
            --proof dist/ula-fetch-trace/ula-fetch-trace.json

      - name: Upload pinned proof
        uses: actions/upload-artifact@v4
        with:
          name: ula-fetch-trace-${{ matrix.id }}-${{ github.sha }}
          path: dist/ula-fetch-trace/ula-fetch-trace.json
          if-no-files-found: error
