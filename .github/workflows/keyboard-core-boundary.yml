name: Keyboard core boundary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/keyboard-core-boundary.yml'
      - 'ci/test/keyboard-core-boundary/**'
      - 'src/app/wz_input_arbiter.*'
      - 'src/app/wz_input_event.h'
      - 'src/app/wz_input_projection.*'
      - 'src/app/wz_input_timing.h'
      - 'src/app/wz_sokol_main.c'
      - 'src/app/wz_telnet_input.*'
      - 'src/core/wz_input_types.h'
      - 'src/core/wz_keyboard_matrix.*'
      - 'src/core/wz_machine.*'
      - 'src/cmake/CMakeLists.txt'
      - 'test-drivers/keyboard-core-boundary.driver.json'
      - 'tests/keyboard-core-boundary.md'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to test
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  regression:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            runner: windows-2025
          - id: windows-arm64
            runner: windows-11-arm
          - id: macos-x64
            runner: macos-15-intel
          - id: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Configure boundary contract
        run: cmake -S ci/test/keyboard-core-boundary -B dist/keyboard-core-boundary -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build boundary contract
        run: cmake --build dist/keyboard-core-boundary --config Release --target wz_keyboard_core_boundary --parallel 2
      - name: Run contract and record runner
        shell: bash
        env:
          MATRIX_ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          executable=dist/keyboard-core-boundary/wz_keyboard_core_boundary
          if [[ "$RUNNER_OS" == "Windows" ]]; then executable="$executable.exe"; fi
          result_dir="dist/keyboard-core-boundary/results/$MATRIX_ID"
          mkdir -p "$result_dir"
          "$executable" | tee "$result_dir/run.log"
          python - <<'PY'
          import json, os
          from pathlib import Path
          record = {
              "id": os.environ["MATRIX_ID"],
              "status": "pass",
              "commit": os.environ["GITHUB_SHA"],
              "os": os.environ["RUNNER_OS"],
              "architecture": os.environ["RUNNER_ARCH"],
              "runnerName": os.environ.get("ImageOS", "hosted runner"),
          }
          Path(f"dist/keyboard-core-boundary/results/{record['id']}/runner.json").write_text(
              json.dumps(record, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Upload runner result
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-core-boundary-raw-${{ matrix.id }}
          path: dist/keyboard-core-boundary/results/
          if-no-files-found: error

  proof:
    if: github.ref == 'refs/heads/main'
    needs: regression
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Download runner results
        uses: actions/download-artifact@v4
        with:
          pattern: keyboard-core-boundary-raw-*
          path: dist/keyboard-core-boundary/artifacts
          merge-multiple: true
      - name: Validate and write proof
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python3 ci/test/keyboard-core-boundary/write-proof.py \
            --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --artifact-root dist/keyboard-core-boundary/artifacts \
            --proof dist/keyboard-core-boundary/keyboard-core-boundary.json
      - name: Upload pinned proof
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-core-boundary-proof-${{ github.sha }}
          path: dist/keyboard-core-boundary/keyboard-core-boundary.json
          if-no-files-found: error
