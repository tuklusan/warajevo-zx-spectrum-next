name: GUI debugger register editing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debugger-registers:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install GUI acceptance dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev libasound2-dev libgl1-mesa-dev \
            libxi-dev libxcursor-dev xvfb xdotool scrot tesseract-ocr
      - name: Build production Release/Sokol host
        run: |
          cmake -S src/cmake -B dist/gui-debugger-registers/product -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DWZSN_BUILD_SOKOL_HOST=ON
          cmake --build dist/gui-debugger-registers/product --config Release \
            --target wz_sokol_host --parallel 2
      - name: Exercise the production debugger register editor
        run: |
          xvfb-run -a python3 ci/test/gui-debugger-registers.py \
            --binary dist/gui-debugger-registers/product/Warajevo-ZX-Spectrum-Next \
            --rom roms/48.rom \
            --proof dist/gui-debugger-registers/proof.json \
            --driver test-drivers/gui-debugger-registers.driver.json \
            --capture-dir dist/gui-debugger-registers/captures
      - name: Upload register-edit proof and screen captures
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gui-debugger-registers-proof
          path: |
            dist/gui-debugger-registers/proof.json
            dist/gui-debugger-registers/captures/*.png
          if-no-files-found: error
          retention-days: 1
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gui-debugger-registers-diagnostic
          path: dist/gui-debugger-registers/product/Warajevo-ZX-Spectrum-Next
          if-no-files-found: warn
          retention-days: 1
