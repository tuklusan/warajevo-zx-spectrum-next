name: Pinned Fuse screen reference

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fuse-visual-reference.yml'
      - 'ci/test/fuse-visual-equivalence/**'
      - 'src/app/**'
      - 'src/core/**'
      - 'src/cmake/**'
      - 'ci/runner-bootstrap/**'
      - 'roms/48.rom'
      - 'test-drivers/fuse-visual-reference.driver.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-reference:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned-build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes autoconf automake build-essential bison gettext \
            flex libbz2-dev libglib2.0-dev libgcrypt20-dev libpng-dev \
            libtool libxml2-dev pkg-config zlib1g-dev
      - name: Build pinned Fuse and capture the certified 48K ROM
        shell: bash
        run: bash ci/test/fuse-visual-equivalence/capture-reference.sh
      - name: Upload pinned screen reference and run metadata
        uses: actions/upload-artifact@v4
        with:
          name: fuse-screen-reference-${{ github.sha }}
          path: dist/fuse-visual-reference/
          if-no-files-found: error
          retention-days: 30

  compare-production-display:
    name: Fuse display equivalence / ${{ matrix.name }}
    if: github.ref == 'refs/heads/main'
    needs: capture-reference
    runs-on: ${{ matrix.label }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            id: windows-x86_64
            label: windows-2025
          - name: Windows ARM64
            id: windows-arm64
            label: windows-11-arm
          - name: macOS Intel
            id: macos-x86_64
            label: macos-15-intel
          - name: macOS ARM64
            id: macos-arm64
            label: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install image comparison dependency
        run: python -m pip install Pillow
      - name: Restore runner bootstrap cache
        id: bootstrap
        uses: actions/cache@v4
        with:
          path: ci/.runner-bootstrap-cache
          key: runner-bootstrap-${{ matrix.id }}-${{ hashFiles('ci/runner-bootstrap/manifests/**', 'ci/runner-bootstrap/**') }}
      - name: Bootstrap Windows desktop runner
        if: runner.os == 'Windows' && steps.bootstrap.outputs.cache-hit != 'true'
        shell: pwsh
        run: .\ci\runner-bootstrap\bootstrap-windows.ps1 ci\runner-bootstrap\manifests\${{ matrix.id }}.txt
      - name: Bootstrap macOS desktop runner
        if: runner.os == 'macOS' && steps.bootstrap.outputs.cache-hit != 'true'
        shell: bash
        run: bash ci/runner-bootstrap/bootstrap-unix.sh ci/runner-bootstrap/manifests/${{ matrix.id }}.txt
      - name: Build production GUI
        shell: bash
        run: |
          cmake -S src/cmake -B dist/fuse-visual/${{ matrix.id }} -G Ninja -DCMAKE_BUILD_TYPE=Release -DWZSN_BUILD_SOKOL_HOST=ON
          cmake --build dist/fuse-visual/${{ matrix.id }} --clean-first --parallel 2
      - name: Allow the app listener through the ephemeral runner firewall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = Join-Path $env:GITHUB_WORKSPACE 'dist/fuse-visual/${{ matrix.id }}/Warajevo-ZX-Spectrum-Next.exe'
          if (-not (Test-Path -LiteralPath $binary)) { throw 'The production GUI binary is missing.' }
          Set-NetFirewallProfile -Profile Domain,Private,Public -NotifyOnListen 'False'
          New-NetFirewallRule -DisplayName 'WZSN temporary visual gate' -Direction Inbound -Action Allow -Program $binary -Profile Any | Out-Null
      - name: Clear first-logon overlays on the Windows ARM runner
        if: matrix.id == 'windows-arm64'
        shell: pwsh
        run: |
          $policy = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\OOBE'
          New-Item -Path $policy -Force | Out-Null
          New-ItemProperty -Path $policy -Name DisablePrivacyExperience -PropertyType DWord -Value 1 -Force | Out-Null
          Write-Host 'Visible windows before runner setup dismissal:'
          Get-Process | Where-Object { $_.MainWindowHandle -ne 0 } |
            ForEach-Object { Write-Host ("{0} ({1}): {2}" -f $_.Name, $_.Id, $_.MainWindowTitle) }
          Get-Process -Name wsl,WindowsTerminal -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          $keyboard = New-Object -ComObject WScript.Shell
          $keyboard.SendKeys('{ESC}')
          Start-Sleep -Seconds 2
          Get-Process -Name wsl,WindowsTerminal -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name msoobe,UserOOBEBroker,CloudExperienceHostBroker -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          $wslServices = Get-Service -Name WslService,LxssManager -ErrorAction SilentlyContinue
          if ($wslServices) {
            $wslServices | Stop-Service -Force -ErrorAction SilentlyContinue
            $wslServices | Set-Service -StartupType Disabled
          }
          Get-Process -Name wsl,WindowsTerminal -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          $overlay = Get-Process -Name msoobe,UserOOBEBroker,CloudExperienceHostBroker -ErrorAction SilentlyContinue
          if ($overlay) { throw "Windows first-logon overlay remains: $($overlay.Name -join ', ')" }
          $wslWindow = Get-Process -Name wsl,WindowsTerminal -ErrorAction SilentlyContinue |
            Where-Object { $_.MainWindowHandle -ne 0 }
          if ($wslWindow) { throw "WSL setup window remains: $($wslWindow.Name -join ', ')" }
      - name: Download pinned Fuse display
        uses: actions/download-artifact@v4
        with:
          name: fuse-screen-reference-${{ github.sha }}
          path: dist/fuse-visual/reference
      - name: Capture production display and compare with Fuse
        shell: bash
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          binary="dist/fuse-visual/${{ matrix.id }}/Warajevo-ZX-Spectrum-Next"
          if [ -f "${binary}.exe" ]; then binary="${binary}.exe"; fi
          python ci/test/fuse-visual-equivalence/capture-candidate.py \
            "$binary" roms/48.rom "dist/fuse-visual/${{ matrix.id }}/evidence"
          python ci/test/fuse-visual-equivalence/compare.py \
            --reference dist/fuse-visual/reference/screen.png \
            --candidate "dist/fuse-visual/${{ matrix.id }}/evidence/application.png" \
            --output "dist/fuse-visual/${{ matrix.id }}/evidence/comparison.json"
          cp dist/fuse-visual/reference/reference-proof.json \
            "dist/fuse-visual/${{ matrix.id }}/evidence/reference-proof.json"
      - name: Upload captures and mismatch metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuse-visual-equivalence-${{ matrix.id }}-${{ github.sha }}
          path: dist/fuse-visual/${{ matrix.id }}/evidence/
          if-no-files-found: warn
          retention-days: 30
