name: UI View menu actions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  view-menu-actions:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install desktop and OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev libasound2-dev libgl1-mesa-dev \
            libxi-dev libxcursor-dev xvfb xdotool imagemagick tesseract-ocr \
            python3-pil
      - name: Build production desktop host
        run: |
          cmake -S src/cmake -B dist/ui-view-menu-actions/product -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DWZSN_BUILD_SOKOL_HOST=ON
          cmake --build dist/ui-view-menu-actions/product --config Release \
            --target wz_sokol_host --parallel 2
      - name: Verify View menu actions through the production GUI
        run: |
          xvfb-run -a python3 ci/test/ui-view-menu-actions.py \
            --binary dist/ui-view-menu-actions/product/Warajevo-ZX-Spectrum-Next \
            --rom roms/48.rom \
            --proof dist/ui-view-menu-actions/proof.json
      - name: Upload proof and screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ui-view-menu-actions-proof
          path: |
            dist/ui-view-menu-actions/proof.json
            dist/ui-view-menu-actions/view-menu.png
            dist/ui-view-menu-actions/status-visible.png
            dist/ui-view-menu-actions/status-hidden.png
            dist/ui-view-menu-actions/status-restored.png
            dist/ui-view-menu-actions/display-settings.png
          if-no-files-found: error
          retention-days: 1
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-view-menu-actions-diagnostic
          path: |
            dist/ui-view-menu-actions/*.png
            dist/ui-view-menu-actions/application-diagnostic.log
          if-no-files-found: warn
          retention-days: 1
