name: Timing trace behavior contract

on:
  push:
    branches: [main]
    paths:
      - 'src/**/*.c'
      - 'src/**/*.h'
      - 'src/**/*.m'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  behavior-contract:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows Intel
            id: windows-x64
            label: windows-2025
          - name: Windows ARM
            id: windows-arm64
            label: windows-11-arm
          - name: macOS Intel
            id: macos-x64
            label: macos-15-intel
          - name: macOS ARM
            id: macos-arm64
            label: macos-15
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.label }}
    steps:
      - name: Check out exact main revision and ROM
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          lfs: true

      - name: Configure behavior regression target
        shell: bash
        run: >-
          cmake -S ci/test/timing-trace-behavior-contract
          -B dist/timing-trace-behavior-contract
          -DCMAKE_BUILD_TYPE=Debug

      - name: Build behavior regression
        run: >-
          cmake --build dist/timing-trace-behavior-contract --config Debug
          --target wz_timing_trace_behavior_contract --parallel 2

      - name: Run trace behavior contract
        shell: bash
        run: >-
          ctest --test-dir dist/timing-trace-behavior-contract
          -C Debug --output-on-failure --verbose
          -R '^wz_timing_trace_behavior_contract$'

      - name: Write pinned hosted proof
        shell: bash
        env:
          PROJECT_COMMIT: ${{ github.sha }}
          PROJECT_RUN_ID: ${{ github.run_id }}
          RUNNER_NAME: ${{ matrix.name }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          if command -v python3 >/dev/null 2>&1; then python_bin=python3; else python_bin=python; fi
          "$python_bin" ci/test/timing-trace-behavior-contract/write-proof.py \
            --commit "$PROJECT_COMMIT" \
            --run-id "$PROJECT_RUN_ID" \
            --runner "$RUNNER_NAME/$RUNNER_OS/$RUNNER_ARCH" \
            --run-log dist/timing-trace-behavior-contract/Testing/Temporary/LastTest.log \
            --proof dist/timing-trace-behavior-contract/timing-trace-behavior-contract.json

      - name: Upload pinned trace behavior proof
        uses: actions/upload-artifact@v4
        with:
          name: timing-trace-behavior-contract-${{ matrix.id }}-${{ github.sha }}
          path: dist/timing-trace-behavior-contract/timing-trace-behavior-contract.json
          if-no-files-found: error
