name: Keyboard matrix electrical contract

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/keyboard-matrix-contract.yml'
      - 'ci/test/keyboard-matrix/**'
      - 'test-drivers/keyboard-matrix.driver.json'
      - 'src/core/wz_keyboard_matrix.c'
      - 'src/core/wz_keyboard_matrix.h'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keyboard-matrix:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact main revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Configure matrix contract
        run: cmake -S ci/test/keyboard-matrix -B dist/keyboard-matrix -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build matrix contract
        run: cmake --build dist/keyboard-matrix --config Release --target wz_keyboard_matrix_contract --parallel 2
      - name: Run matrix contract
        run: dist/keyboard-matrix/wz_keyboard_matrix_contract
      - name: Write pinned proof
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          python3 ci/test/keyboard-matrix/write-proof.py \
            --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --runner "$RUNNER_OS/$RUNNER_ARCH" \
            --proof dist/keyboard-matrix/keyboard-matrix.json
      - name: Upload pinned proof
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-matrix-${{ github.sha }}
          path: dist/keyboard-matrix/keyboard-matrix.json
          if-no-files-found: error
