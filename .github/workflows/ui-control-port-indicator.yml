name: UI Control Port indicator contract

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ui-control-port-indicator.yml'
      - 'ci/test/ui-control-port-indicator/**'
      - 'test-drivers/ui-control-port-indicator.driver.json'
      - 'src/app/wz_control_port.h'
      - 'src/app/wz_ui_layout.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-control-port-indicator:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact main revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Configure indicator contract
        run: cmake -S ci/test/ui-control-port-indicator -B dist/ui-control-port-indicator -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build indicator contract
        run: cmake --build dist/ui-control-port-indicator --config Release --target wz_ui_control_port_indicator_contract --parallel 2
      - name: Run indicator contract
        run: dist/ui-control-port-indicator/wz_ui_control_port_indicator_contract
      - name: Write pinned proof
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          python3 ci/test/ui-control-port-indicator/write-proof.py \
            --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --runner "$RUNNER_OS/$RUNNER_ARCH" \
            --proof dist/ui-control-port-indicator/ui-control-port-indicator.json
      - name: Upload pinned proof
        uses: actions/upload-artifact@v4
        with:
          name: ui-control-port-indicator-${{ github.sha }}
          path: dist/ui-control-port-indicator/ui-control-port-indicator.json
          if-no-files-found: error
