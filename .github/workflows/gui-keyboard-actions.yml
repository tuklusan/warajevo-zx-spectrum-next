name: GUI keyboard command actions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keyboard-actions:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev libasound2-dev libgl1-mesa-dev \
            libxi-dev libxcursor-dev xvfb xdotool
      - name: Build production Release/Sokol host
        run: |
          cmake -S src/cmake -B dist/gui-keyboard-actions/product -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DWZSN_BUILD_SOKOL_HOST=ON
          cmake --build dist/gui-keyboard-actions/product --config Release \
            --target wz_sokol_host --parallel 2
      - name: Verify keyboard-only production actions
        run: |
          xvfb-run -a python3 ci/test/gui-keyboard-actions.py \
            --binary dist/gui-keyboard-actions/product/Warajevo-ZX-Spectrum-Next \
            --rom roms/48.rom \
            --proof dist/gui-keyboard-actions/proof.json \
            --driver test-drivers/gui-keyboard-actions.driver.json
      - name: Upload hosted proof
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gui-keyboard-actions-proof
          path: dist/gui-keyboard-actions/proof.json
          if-no-files-found: error
          retention-days: 1
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gui-keyboard-actions-diagnostic
          path: dist/gui-keyboard-actions/application.log
          if-no-files-found: warn
          retention-days: 1
