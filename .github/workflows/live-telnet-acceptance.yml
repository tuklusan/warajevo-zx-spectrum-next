name: Production live Telnet acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-socket:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x86_64
            runner: windows-2025
          - id: windows-arm64
            runner: windows-11-arm
          - id: macos-x86_64
            runner: macos-15-intel
          - id: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Restore runner bootstrap cache
        id: bootstrap
        uses: actions/cache@v4
        with:
          path: ci/.runner-bootstrap-cache
          key: runner-bootstrap-${{ matrix.id }}-${{ hashFiles('ci/runner-bootstrap/manifests/**', 'ci/runner-bootstrap/**') }}

      - name: Bootstrap Windows runner
        if: runner.os == 'Windows' && steps.bootstrap.outputs.cache-hit != 'true'
        shell: pwsh
        run: .\ci\runner-bootstrap\bootstrap-windows.ps1 ci\runner-bootstrap\manifests\${{ matrix.id }}.txt

      - name: Bootstrap macOS runner
        if: runner.os != 'Windows' && steps.bootstrap.outputs.cache-hit != 'true'
        shell: bash
        run: bash ci/runner-bootstrap/bootstrap-unix.sh ci/runner-bootstrap/manifests/${{ matrix.id }}.txt

      - name: Record bootstrap identity
        if: steps.bootstrap.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p ci/.runner-bootstrap-cache
          printf 'runner_label=%s\n' '${{ matrix.runner }}' > ci/.runner-bootstrap-cache/manifest.txt

      - name: Verify certified ROM
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          digest = hashlib.sha256(Path('roms/48.rom').read_bytes()).hexdigest()
          assert digest == 'd55daa439b673b0e3f5897f99ac37ecb45f974d1862b4dadb85dec34af99cb42'
          PY

      - name: Build production desktop host
        shell: bash
        run: |
          cmake -S src/cmake -B dist/live-telnet -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DWZSN_BUILD_SOKOL_HOST=ON
          cmake --build dist/live-telnet --clean-first --parallel 2

      - name: Allow the app listener through the ephemeral Windows firewall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = Join-Path $env:GITHUB_WORKSPACE 'dist/live-telnet/Warajevo-ZX-Spectrum-Next.exe'
          if (-not (Test-Path -LiteralPath $binary)) { throw 'The production binary is missing.' }
          Set-NetFirewallProfile -Profile Domain,Private,Public -NotifyOnListen 'False'
          New-NetFirewallRule -DisplayName 'WZSN temporary live Telnet gate' -Direction Inbound -Action Allow -Program $binary -Profile Any | Out-Null

      - name: Exercise the production listener
        shell: bash
        run: |
          binary=dist/live-telnet/Warajevo-ZX-Spectrum-Next
          interpreter=python3
          if [[ "$RUNNER_OS" == Windows ]]; then
            binary="${binary}.exe"
            interpreter=python
          fi
          "$interpreter" ci/test/live-telnet-acceptance.py \
            --binary "$binary" --rom roms/48.rom \
            --proof dist/live-telnet/proof.json

      - name: Remove temporary Windows firewall rule
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-NetFirewallRule -DisplayName 'WZSN temporary live Telnet gate' -ErrorAction SilentlyContinue | Remove-NetFirewallRule

      - name: Upload aggregate proof only
        uses: actions/upload-artifact@v4
        with:
          name: live-telnet-${{ matrix.id }}-${{ github.sha }}
          path: dist/live-telnet/proof.json
          if-no-files-found: error

      - name: Show product startup diagnostics on failure
        if: failure()
        shell: bash
        run: |
          if [[ -f dist/live-telnet/application.log ]]; then
            tail -n 20 dist/live-telnet/application.log
          fi
