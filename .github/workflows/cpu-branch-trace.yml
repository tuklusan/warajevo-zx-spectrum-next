name: Project-owned CPU branch trace

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branch-trace:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Configure CPU branch trace
        run: cmake -S ci/test/cpu-branch-trace -B dist/cpu-branch-trace -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build CPU branch trace
        run: cmake --build dist/cpu-branch-trace --target wz_cpu_branch_trace --parallel 2
      - name: Verify branch traces
        run: |
          set -o pipefail
          dist/cpu-branch-trace/wz_cpu_branch_trace | tee dist/cpu-branch-trace/proof.json
      - name: Upload proof
        uses: actions/upload-artifact@v4
        with:
          name: cpu-branch-trace-proof
          path: dist/cpu-branch-trace/proof.json
          if-no-files-found: error
