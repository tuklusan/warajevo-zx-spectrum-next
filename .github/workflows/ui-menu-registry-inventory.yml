name: UI menu registry inventory

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry-inventory:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev libasound2-dev libgl1-mesa-dev \
            libxi-dev libxcursor-dev xvfb xdotool
      - name: Build production desktop host
        run: |
          cmake -S src/cmake -B dist/ui-menu-registry-inventory/product -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DWZSN_BUILD_SOKOL_HOST=ON
          cmake --build dist/ui-menu-registry-inventory/product --config Release \
            --target wz_sokol_host --parallel 2
      - name: Verify canonical menu IDs and metadata
        run: |
          xvfb-run -a python3 ci/test/ui-menu-registry-inventory.py \
            --binary dist/ui-menu-registry-inventory/product/Warajevo-ZX-Spectrum-Next \
            --rom roms/48.rom \
            --architecture docs/design/02-warajevo-zx-spectrum-next-ui-architecture.md \
            --proof dist/ui-menu-registry-inventory/proof.json
      - name: Upload temporary proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-menu-registry-inventory-proof
          path: dist/ui-menu-registry-inventory/proof.json
          if-no-files-found: warn
          retention-days: 1
