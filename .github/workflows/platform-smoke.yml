name: platform-smoke

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64
            label: ubuntu-22.04
          - id: linux-x64-latest
            label: ubuntu-latest
          - id: linux-x64-24
            label: ubuntu-24.04
          - id: linux-x64-26
            label: ubuntu-26.04
          - id: linux-arm64-22
            label: ubuntu-22.04-arm
          - id: linux-arm64
            label: ubuntu-24.04-arm
          - id: linux-arm64-26
            label: ubuntu-26.04-arm
          - id: windows-latest
            label: windows-latest
          - id: windows-server-2022
            label: windows-2022
          - id: windows-server-2025
            label: windows-2025
          - id: windows-server-2025-vs2026
            label: windows-2025-vs2026
          - id: macos-arm64-latest
            label: macos-latest
          - id: macos-arm64
            label: macos-15
          - id: macos-arm64-14
            label: macos-14
          - id: macos-intel-x64
            label: macos-15-intel
          - id: macos-intel-26
            label: macos-26-intel
          - id: macos-arm64-26
            label: macos-26
          - id: macos-xcode-27
            label: xcode-27

    name: ${{ matrix.id }}
    runs-on: ${{ matrix.label }}
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run shared CMake smoke harness
        run: python tools/harness/run_cmake_smoke.py --artifact-dir .wzsn-harness/github/${{ matrix.id }}

      - name: Run supported Sokol host smoke harness
        if: matrix.id == 'windows-latest' || matrix.id == 'macos-arm64-14'
        run: python tools/harness/run_cmake_smoke.py --artifact-dir .wzsn-harness/github/${{ matrix.id }}-sokol --sokol-host

      - name: Run pinned Fuse ED conformance
        run: python tools/harness/run_fuse_ed_platform.py --runner-root .wzsn-harness/github/${{ matrix.id }}/build --private-root test-artefacts/github/${{ matrix.id }} --manifest .wzsn-harness/github/${{ matrix.id }}/fuse-complete-manifest.json --unresolved-baseline tools/harness/fuse-unresolved-baseline.json

      - name: Upload smoke artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-smoke-${{ matrix.id }}
          path: .wzsn-harness/github/${{ matrix.id }}
          if-no-files-found: error

  publication-gate:
    name: publication-gate
    if: always()
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify one run and one commit are being published
        env:
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_SHA: ${{ github.sha }}
          MATRIX_RESULT: ${{ needs.smoke.result }}
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'run_id=%s\nsha=%s\nmatrix_result=%s\n' "$EXPECTED_RUN_ID" "$EXPECTED_SHA" "$MATRIX_RESULT"
          test -n "$EXPECTED_RUN_ID"
          test "$EXPECTED_SHA" = "${GITHUB_SHA}"
          test "$MATRIX_RESULT" = success
          expected='linux-x64 linux-x64-latest linux-x64-24 linux-x64-26 linux-arm64-22 linux-arm64 linux-arm64-26 windows-latest windows-server-2022 windows-server-2025 windows-server-2025-vs2026 macos-arm64-latest macos-arm64 macos-arm64-14 macos-intel-x64 macos-intel-26 macos-arm64-26 macos-xcode-27'
          actual=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${EXPECTED_RUN_ID}/jobs?per_page=100" --jq '.jobs[] | select(.name != "publication-gate") | [.name, .head_sha, .conclusion] | @tsv')
          test "$(printf '%s\n' "$actual" | wc -l)" -eq 18
          while IFS=$'\t' read -r name sha conclusion; do
            case " $expected " in *" $name "*) ;; *) exit 1 ;; esac
            test "$sha" = "$EXPECTED_SHA"
            test "$conclusion" = success
          done <<< "$actual"
