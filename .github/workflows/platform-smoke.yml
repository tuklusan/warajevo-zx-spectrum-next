name: platform-smoke

run-name: platform-smoke @ ${{ github.sha }}

concurrency:
  group: platform-smoke-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  housekeeping:
    name: deep-housekeeping
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Clear stale runs and temporary artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/harness/cleanup-hosted-runner-state.sh

  smoke:
    needs: housekeeping
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64
            label: ubuntu-22.04
          - id: linux-x64-latest
            label: ubuntu-latest
          - id: linux-x64-24
            label: ubuntu-24.04
          - id: linux-x64-26
            label: ubuntu-26.04
          - id: linux-arm64-22
            label: ubuntu-22.04-arm
          - id: linux-arm64
            label: ubuntu-24.04-arm
          - id: linux-arm64-26
            label: ubuntu-26.04-arm
          - id: windows-latest
            label: windows-latest
          - id: windows-server-2022
            label: windows-2022
          - id: windows-server-2025
            label: windows-2025
          - id: windows-server-2025-vs2026
            label: windows-2025-vs2026
          - id: windows-arm-11
            label: windows-11-arm
          - id: windows-arm-11-vs2026
            label: windows-11-vs2026-arm
          - id: macos-arm64-latest
            label: macos-latest
          - id: macos-arm64
            label: macos-15
          - id: macos-arm64-14
            label: macos-14
          - id: macos-intel-x64
            label: macos-15-intel
          - id: macos-intel-26
            label: macos-26-intel
          - id: macos-arm64-26
            label: macos-26
          - id: macos-xcode-27
            label: xcode-27

    name: ${{ matrix.id }}
    runs-on: ${{ matrix.label }}
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Clear runner workspace build and test residue
        run: bash tools/harness/cleanup-hosted-runner-state.sh --workspace-only

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run shared CMake smoke harness
        run: python tools/harness/run_cmake_smoke.py --artifact-dir .wzsn-harness/github/${{ matrix.id }}

      - name: Run supported Sokol host smoke harness
        if: matrix.id == 'windows-latest' || matrix.id == 'macos-arm64-14'
        run: python tools/harness/run_cmake_smoke.py --artifact-dir .wzsn-harness/github/${{ matrix.id }}-sokol --sokol-host

      - name: Run pinned Fuse ED conformance
        run: python tools/harness/run_fuse_ed_platform.py --runner-root .wzsn-harness/github/${{ matrix.id }}/build --private-root test-artefacts/github/${{ matrix.id }} --manifest .wzsn-harness/github/${{ matrix.id }}/fuse-complete-manifest.json --unresolved-baseline tools/harness/fuse-unresolved-baseline.json

      - name: Verify and record lane evidence
        run: python tools/harness/verify_platform_evidence.py --artifact-dir .wzsn-harness/github/${{ matrix.id }} --lane-id ${{ matrix.id }}

      - name: Upload smoke artefacts (attempt 1)
        id: upload-smoke-1
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: platform-smoke-${{ matrix.id }}
          path: .wzsn-harness/github/${{ matrix.id }}
          if-no-files-found: error

      - name: Upload smoke artefacts (attempt 2)
        id: upload-smoke-2
        if: always() && steps.upload-smoke-1.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: platform-smoke-${{ matrix.id }}-retry-2
          path: .wzsn-harness/github/${{ matrix.id }}
          if-no-files-found: error

      - name: Upload smoke artefacts (attempt 3)
        if: always() && steps.upload-smoke-1.outcome == 'failure' && steps.upload-smoke-2.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: platform-smoke-${{ matrix.id }}-retry-3
          path: .wzsn-harness/github/${{ matrix.id }}
          if-no-files-found: error

  publication-gate:
    name: publication-gate
    if: always()
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify one run and one commit are being published
        env:
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_SHA: ${{ github.sha }}
          MATRIX_RESULT: ${{ needs.smoke.result }}
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'run_id=%s\nsha=%s\nmatrix_result=%s\n' "$EXPECTED_RUN_ID" "$EXPECTED_SHA" "$MATRIX_RESULT"
          test -n "$EXPECTED_RUN_ID"
          test "$EXPECTED_SHA" = "${GITHUB_SHA}"
          expected='linux-x64 linux-x64-latest linux-x64-24 linux-x64-26 linux-arm64-22 linux-arm64 linux-arm64-26 windows-latest windows-server-2022 windows-server-2025 windows-server-2025-vs2026 windows-arm-11 windows-arm-11-vs2026 macos-arm64-latest macos-arm64 macos-arm64-14 macos-intel-x64 macos-intel-26 macos-arm64-26 macos-xcode-27'
          actual=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${EXPECTED_RUN_ID}/jobs?per_page=100" --jq '.jobs[] | select(.name != "publication-gate" and .name != "deep-housekeeping") | [.name, .head_sha, .conclusion] | @tsv')
          test "$(printf '%s\n' "$actual" | wc -l)" -eq 20
          intel_success=0
          arm_success=0
          while IFS=$'\t' read -r name sha conclusion; do
            case " $expected " in *" $name "*) ;; *) exit 1 ;; esac
            test "$sha" = "$EXPECTED_SHA"
            case "$name" in
              macos-intel-*)
                test -n "$conclusion"
                [ "$conclusion" = success ] && intel_success=1
                ;;
              macos-*)
                test -n "$conclusion"
                [ "$conclusion" = success ] && arm_success=1
                ;;
              *)
                test "$conclusion" = success
                ;;
            esac
          done <<< "$actual"
          test "$intel_success" -eq 1
          test "$arm_success" -eq 1

      - name: Check out repository for retained evidence verification
        uses: actions/checkout@v4

      - name: Download every lane evidence bundle
        uses: actions/download-artifact@v4
        with:
          pattern: platform-smoke-*
          path: .wzsn-published-artifacts
          merge-multiple: false

      - name: Inspect every retained result manifest and evidence hash
        run: |
          test "$(find .wzsn-published-artifacts -name result-manifest.json -type f | wc -l)" -eq 20
          python tools/harness/verify_platform_evidence.py --verify-tree .wzsn-published-artifacts
