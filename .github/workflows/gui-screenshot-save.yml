name: GUI screenshot save acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot-save:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev libasound2-dev libgl1-mesa-dev libxi-dev libxcursor-dev xvfb xdotool
      - name: Build production desktop host
        run: |
          cmake -S src/cmake -B dist/gui-screenshot-save/product -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DWZSN_BUILD_SOKOL_HOST=ON
          cmake --build dist/gui-screenshot-save/product --config Release \
            --target wz_sokol_host --parallel 2
      - name: Exercise native save and cancellation
        run: |
          xvfb-run -a python3 ci/test/gui-screenshot-save.py \
            --binary dist/gui-screenshot-save/product/wz_sokol_host \
            --rom roms/48.rom \
            --proof dist/gui-screenshot-save/proof.json
      - name: Upload aggregate proof
        uses: actions/upload-artifact@v4
        with:
          name: gui-screenshot-save-proof
          path: dist/gui-screenshot-save/proof.json
          if-no-files-found: error
