name: Telnet screenshot runtime

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot-runtime:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev libasound2-dev libgl1-mesa-dev \
            libxi-dev libxcursor-dev xvfb xdotool
      - name: Build production desktop host
        run: |
          cmake -S src/cmake -B dist/telnet-screenshot-runtime/product -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DWZSN_BUILD_SOKOL_HOST=ON
          cmake --build dist/telnet-screenshot-runtime/product --config Release \
            --target wz_sokol_host --parallel 2
      - name: Verify live Telnet screenshot contract
        run: |
          xvfb-run -a python3 ci/test/telnet-screenshot-runtime.py \
            --binary dist/telnet-screenshot-runtime/product/Warajevo-ZX-Spectrum-Next \
            --rom roms/48.rom \
            --proof dist/telnet-screenshot-runtime/proof.json
      - name: Upload temporary proof
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: telnet-screenshot-runtime-proof
          path: dist/telnet-screenshot-runtime/proof.json
          if-no-files-found: error
          retention-days: 1
