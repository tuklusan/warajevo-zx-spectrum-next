name: Open Run basename routing contract

on:
  push:
    branches: [main]
    paths:
      - 'src/**/*.c'
      - 'src/**/*.h'
      - 'src/**/*.m'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            runner: windows-2025
          - id: windows-arm64
            runner: windows-11-arm
          - id: macos-x64
            runner: macos-15-intel
          - id: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Configure and run contract
        run: |
          cmake -S ci/test/file-open-run-path -B dist/file-open-run-path -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build dist/file-open-run-path --config Release --target wz_file_open_run_path_contract --parallel 2
          ctest --test-dir dist/file-open-run-path --output-on-failure --verbose -R '^wz_file_open_run_path_contract$'
      - name: Write source-pinned proof
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: python3 ci/test/file-open-run-path/write-proof.py --proof dist/file-open-run-path/file-open-run-path.json
      - uses: actions/upload-artifact@v4
        with:
          name: file-open-run-path-${{ matrix.id }}-${{ github.sha }}
          path: dist/file-open-run-path/file-open-run-path.json
          if-no-files-found: error
