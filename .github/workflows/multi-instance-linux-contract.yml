name: Linux multi-instance stress contract

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stress:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64
            runner: ubuntu-24.04
          - id: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Configure stress worker
        shell: bash
        run: cmake -S ci/test/multi-instance -B dist/multi-instance -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build stress worker
        shell: bash
        run: cmake --build dist/multi-instance --config Release --target wz_multi_instance_worker --parallel 2
      - name: Run five contention cases
        shell: bash
        run: |
          set -euo pipefail
          python ci/test/multi-instance/run-stress.py dist/multi-instance/wz_multi_instance_worker | tee dist/multi-instance/run.log
      - name: Record runner identity
        shell: bash
        env:
          MATRIX_ID: ${{ matrix.id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path("dist/multi-instance/runner.json").write_text(json.dumps({
              "id": os.environ["MATRIX_ID"],
              "os": os.environ["RUNNER_OS"],
              "architecture": os.environ["RUNNER_ARCH"],
              "runnerName": os.environ.get("ImageOS", "hosted runner"),
          }, indent=2) + "\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: multi-instance-linux-raw-${{ matrix.id }}
          path: |
            dist/multi-instance/run.log
            dist/multi-instance/runner.json
          if-no-files-found: error
          retention-days: 1

  proof:
    if: github.ref == 'refs/heads/main'
    needs: stress
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: multi-instance-linux-raw-*
          path: dist/multi-instance-linux/artifacts
      - name: Aggregate source-pinned Linux proof
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python3 ci/test/multi-instance-linux/write-proof.py --artifact-root dist/multi-instance-linux/artifacts --proof-out dist/multi-instance-linux/multi-instance-linux.json
      - uses: actions/upload-artifact@v4
        with:
          name: multi-instance-linux-proof-${{ github.sha }}
          path: dist/multi-instance-linux/multi-instance-linux.json
          if-no-files-found: error
          retention-days: 1
