name: Certified model switch regression

on:
  push:
    branches: [main]
    paths:
      - 'src/core/wz_machine.*'
      - 'src/app/wz_sokol_main.c'
      - 'src/app/wz_telnet_alias_response.*'
      - 'ci/test/model-switch/**'
      - 'ci/runner-bootstrap/**'
      - 'roms/48.rom'
      - 'test-media/DIZZY4K.TAP'
      - 'test-drivers/model-switch.driver.json'
      - '.github/workflows/model-switch-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            runner: windows-2025
            bootstrap: windows-x86_64
            label: Windows Intel
          - id: windows-arm64
            runner: windows-11-arm
            bootstrap: windows-arm64
            label: Windows ARM64
          - id: macos-x64
            runner: macos-15-intel
            bootstrap: macos-x86_64
            label: macOS Intel
          - id: macos-arm64
            runner: macos-15
            bootstrap: macos-arm64
            label: macOS ARM64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Restore bootstrap cache
        id: bootstrap
        uses: actions/cache@v4
        with:
          path: ci/.runner-bootstrap-cache
          key: runner-bootstrap-${{ matrix.bootstrap }}-${{ hashFiles('ci/runner-bootstrap/manifests/**', 'ci/runner-bootstrap/**') }}

      - name: Bootstrap Windows runner
        if: runner.os == 'Windows' && steps.bootstrap.outputs.cache-hit != 'true'
        shell: pwsh
        run: .\ci\runner-bootstrap\bootstrap-windows.ps1 ci\runner-bootstrap\manifests\${{ matrix.bootstrap }}.txt

      - name: Bootstrap Unix runner
        if: runner.os != 'Windows' && steps.bootstrap.outputs.cache-hit != 'true'
        shell: bash
        run: bash ci/runner-bootstrap/bootstrap-unix.sh ci/runner-bootstrap/manifests/${{ matrix.bootstrap }}.txt

      - name: Record bootstrap identity
        if: steps.bootstrap.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p ci/.runner-bootstrap-cache
          {
            echo "runner_label=${{ matrix.runner }}"
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "image=${ImageOS:-unknown}"
            echo "manifest=ci/runner-bootstrap/manifests/${{ matrix.bootstrap }}.txt"
            echo "recorded_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > ci/.runner-bootstrap-cache/manifest.txt

      - name: Configure regression executables
        run: cmake -S ci/test/model-switch -B dist/model-switch -DCMAKE_BUILD_TYPE=Release

      - name: Build regression executables
        run: cmake --build dist/model-switch --config Release --target wz_model_switch_regression wz_telnet_model_alias_regression --parallel 2

      - name: Run model and Telnet regressions
        shell: bash
        run: |
          set -euo pipefail
          model=dist/model-switch/wz_model_switch_regression
          alias=dist/model-switch/wz_telnet_model_alias_regression
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            model=dist/model-switch/Release/wz_model_switch_regression.exe
            alias=dist/model-switch/Release/wz_telnet_model_alias_regression.exe
          fi
          mkdir -p dist/model-switch/results
          "$model" | tee dist/model-switch/results/run.log
          "$alias" | tee -a dist/model-switch/results/run.log

      - name: Configure and build the desktop host
        shell: bash
        run: |
          cmake -S src/cmake -B dist/model-switch/product -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DWZSN_BUILD_SOKOL_HOST=ON
          cmake --build dist/model-switch/product --clean-first --parallel 2

      - name: Run live Telnet model switch regression
        shell: bash
        run: |
          set -euo pipefail
          binary=dist/model-switch/product/Warajevo-ZX-Spectrum-Next
          python_bin=python3
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            binary="${binary}.exe"
            python_bin=python
          fi
          "$python_bin" ci/test/model-switch/telnet-model-switch.py \
            "$binary" test-media/DIZZY4K.TAP roms/48.rom \
            dist/model-switch/results/live | tee -a dist/model-switch/results/run.log

      - name: Save runner metadata
        shell: bash
        env:
          MATRIX_ID: ${{ matrix.id }}
          MATRIX_LABEL: ${{ matrix.label }}
        run: |
          python_bin=python3
          if ! command -v "$python_bin" >/dev/null 2>&1; then python_bin=python; fi
          result_dir="dist/model-switch/results/$MATRIX_ID"
          mkdir -p "$result_dir"
          cp dist/model-switch/results/run.log "$result_dir/run.log"
          cp -R dist/model-switch/results/live "$result_dir/live"
          "$python_bin" - <<'PY'
          import json, os
          from pathlib import Path
          record = {
              "id": os.environ["MATRIX_ID"],
              "runnerLabel": os.environ["MATRIX_LABEL"],
              "os": os.environ["RUNNER_OS"],
              "architecture": os.environ["RUNNER_ARCH"],
              "runnerName": os.environ.get("ImageOS", "hosted runner"),
          }
          Path(f"dist/model-switch/results/{record['id']}/runner.json").write_text(
              json.dumps(record, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload runner results
        uses: actions/upload-artifact@v4
        with:
          name: model-switch-raw-${{ matrix.id }}
          path: dist/model-switch/results/
          if-no-files-found: error

  proof:
    if: github.ref == 'refs/heads/main'
    needs: regression
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Download runner results
        uses: actions/download-artifact@v4
        with:
          pattern: model-switch-raw-*
          path: dist/model-switch/results
          merge-multiple: true

      - name: Aggregate pinned model switch proof
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python3 ci/test/model-switch/write-proof.py \
            --project-commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --artifact-root dist/model-switch/results \
            --proof-out dist/model-switch/model-switch.json

      - name: Upload pinned proof
        uses: actions/upload-artifact@v4
        with:
          name: model-switch-proof-${{ github.sha }}
          path: dist/model-switch/model-switch.json
          if-no-files-found: error
