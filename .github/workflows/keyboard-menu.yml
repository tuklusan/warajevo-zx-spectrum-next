name: Keyboard menu contract

on:
  push:
    branches: [main]
    paths:
      - 'src/**/*.c'
      - 'src/**/*.h'
      - 'src/**/*.m'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keyboard-menu:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact main revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Configure contract
        run: cmake -S ci/test/keyboard-menu -B dist/keyboard-menu -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build contract
        run: cmake --build dist/keyboard-menu --config Release --target wz_keyboard_menu_contract --parallel 2
      - name: Run contract
        run: dist/keyboard-menu/wz_keyboard_menu_contract
      - name: Verify host workflow bindings
        run: python3 ci/test/keyboard-menu/verify-integration.py
      - name: Write pinned proof
        env:
          PROJECT_COMMIT: ${{ github.sha }}
          PROJECT_RUN_ID: ${{ github.run_id }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          python3 ci/test/keyboard-menu/write-proof.py \
            --commit "$PROJECT_COMMIT" --run-id "$PROJECT_RUN_ID" \
            --runner "$RUNNER_OS/$RUNNER_ARCH" \
            --proof dist/keyboard-menu/keyboard-menu.json
      - name: Upload pinned proof
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-menu-${{ github.sha }}
          path: dist/keyboard-menu/keyboard-menu.json
          if-no-files-found: error
