name: Full native build and test

on:
  push:
    branches: [main]
    paths:
      - 'src/**/*.c'
      - 'src/**/*.h'
      - 'src/**/*.m'
      - 'src/cmake/**'
      - 'ci/test/**/*.c'
      - 'ci/test/**/*.h'
      - 'ci/test/**/CMakeLists.txt'
      - 'ci/test/**/*.cmake'
      - 'tests/**/*.c'
      - 'tests/**/*.h'
  workflow_dispatch:
    inputs:
      evidence_run_id:
        description: Reuse a completed main-branch native run's runner evidence
        required: false
        type: string
      evidence_commit:
        description: Full source commit recorded by that native run
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  clean-build:
    name: Full build / ${{ matrix.name }}
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_dispatch' ||
       (inputs.evidence_run_id == '' && inputs.evidence_commit == ''))
    runs-on: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            label: windows-2025
            architecture: X64
            performance_runner: Windows-windows-x64
            performance_baseline: windows-x64
          - name: Linux x64
            label: ubuntu-24.04
            architecture: X64
            performance_runner: Linux-ubuntu-24.04
            performance_baseline: linux-x64
          - name: Linux ARM64
            label: ubuntu-24.04-arm
            architecture: ARM64
            performance_runner: Linux-ubuntu-24.04-arm
            performance_baseline: linux-arm64
          - name: macOS ARM64
            label: macos-15
            architecture: ARM64
            performance_runner: macOS-macos-arm64
            performance_baseline: macos-arm64
          - name: macOS Intel
            label: macos-15-intel
            architecture: X64
            performance_runner: macOS-macos-x64
            performance_baseline: macos-x64

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Fetch private media for playback regression
        if: runner.os != 'Windows'
        shell: bash
        run: git lfs pull --include='test-media/**'

      - name: Verify native runner architecture
        shell: bash
        run: |
          if [[ "$RUNNER_ARCH" != "${{ matrix.architecture }}" ]]; then
            echo "Expected ${{ matrix.architecture }}, got $RUNNER_ARCH" >&2
            exit 1
          fi

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libasound2-dev \
            libgl1-mesa-dev \
            libgtk-3-dev \
            libxcursor-dev \
            libxi-dev \
            libx11-dev \
            xvfb \
            pkg-config

      - name: Clean CMake configure and build
        shell: bash
        run: |
          set -o pipefail
          cmake -S src/cmake -B dist/cr-gate-${{ matrix.label }} -DCMAKE_BUILD_TYPE=Release -DWZSN_BUILD_SOKOL_HOST=ON
          cmake --build dist/cr-gate-${{ matrix.label }} --clean-first --config Release --parallel 2 2>&1 \
            | tee "dist/cr-gate-${{ matrix.label }}/build.log"
          ctest --test-dir dist/cr-gate-${{ matrix.label }} -C Release --output-on-failure --verbose \
            | tee dist/cr-gate-${{ matrix.label }}/ctest.log

      - name: Sanitized MDR image and transition fuzz
        if: runner.os != 'Windows'
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          build_dir="dist/sanitizer-${{ matrix.label }}"
          cmake -S src/cmake -B "$build_dir" -DCMAKE_BUILD_TYPE=Debug \
            -DWZSN_ENABLE_SANITIZERS=ON -DWZSN_BUILD_SOKOL_HOST=OFF
          cmake --build "$build_dir" --config Debug \
            --target wz_microdrive_transition_fuzz --parallel 2
          ctest --test-dir "$build_dir" -C Debug \
            -R '^wz_microdrive_transition_fuzz$' --output-on-failure --verbose

      - name: Debug Sokol trace startup and shutdown
        if: runner.os == 'Linux' && matrix.name == 'Linux x64'
        shell: bash
        run: |
          set -o pipefail
          build_dir="dist/debug-trace-${{ matrix.label }}"
          cmake -S src/cmake -B "$build_dir" -DCMAKE_BUILD_TYPE=Debug \
            -DWZSN_BUILD_SOKOL_HOST=ON
          cmake --build "$build_dir" --config Debug \
            --target wz_sokol_host --parallel 2
          xvfb-run -a python3 ci/test/debug-trace-startup.py \
            --executable "$build_dir/Warajevo-ZX-Spectrum-Next" \
            --output "$build_dir/evidence" \
            | tee "$build_dir/debug-trace-startup.json"

      - name: Phase-16 correctness and performance regression
        shell: bash
        env:
          WZ_PERF_COMMIT: ${{ github.sha }}
          WZ_PERF_RUNNER: ${{ matrix.performance_runner }}
          WZ_PERF_ARCH: ${{ matrix.architecture }}
        run: |
          set -o pipefail
          export WZ_PERF_TIMESTAMP="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          build_dir="dist/performance-${{ matrix.label }}"
          cmake -S ci/test/performance -B "$build_dir" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$build_dir" --config Release --target wz_performance_baseline --parallel 2
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            executable="$build_dir/Release/wz_performance_baseline.exe"
          else
            executable="$build_dir/wz_performance_baseline"
          fi
          "$executable" | tee "$build_dir/current.json"
          python ci/test/performance/compare.py \
            "$build_dir/current.json" \
            "ci/test/performance/baselines/${{ matrix.performance_baseline }}.json"

      - name: Write hosted runner evidence
        shell: bash
        run: |
          python ci/test/performance/write-runner-evidence.py \
            --commit "$GITHUB_SHA" \
            --platform "${{ matrix.name }}" \
            --job-name "Full build / ${{ matrix.name }}" \
            --runner "${{ matrix.performance_runner }}" \
            --architecture "${{ matrix.architecture }}" \
            --slug "${{ matrix.performance_baseline }}" \
            --ctest-log "dist/cr-gate-${{ matrix.label }}/ctest.log" \
            --performance-record "dist/performance-${{ matrix.label }}/current.json" \
            --output-dir "dist/runner-evidence"
          cp "dist/cr-gate-${{ matrix.label }}/build.log" \
            "dist/runner-evidence/build-${{ matrix.performance_baseline }}.log"
          if [[ "${{ matrix.name }}" == "Linux x64" ]]; then
            cp "dist/debug-trace-${{ matrix.label }}/debug-trace-startup.json" \
              "dist/runner-evidence/debug-trace-startup.json"
          fi

      - name: Upload temporary runner evidence
        uses: actions/upload-artifact@v4
        with:
          name: runner-evidence-${{ matrix.performance_baseline }}
          path: dist/runner-evidence/*
          if-no-files-found: error
          retention-days: 1

  write-hosted-proof:
    name: Generate hosted test evidence
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && needs.clean-build.result == 'success') ||
       (github.event_name == 'workflow_dispatch' &&
        (inputs.evidence_run_id != '' || inputs.evidence_commit != '' ||
         needs.clean-build.result == 'success')))
    needs: clean-build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Validate proof source selection
        id: source-selection
        env:
          EVIDENCE_COMMIT: ${{ inputs.evidence_commit }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [[ -n "$EVIDENCE_COMMIT" && -n "$EVIDENCE_RUN_ID" ]]; then
            curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$EVIDENCE_RUN_ID" \
              > "$RUNNER_TEMP/evidence-run.json"
            curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$EVIDENCE_RUN_ID/jobs?per_page=100" \
              > "$RUNNER_TEMP/evidence-jobs.json"
            curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$EVIDENCE_RUN_ID/artifacts?per_page=100" \
              > "$RUNNER_TEMP/evidence-artifacts.json"
            python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          run = json.loads((root / "evidence-run.json").read_text())
          if (run.get("status") != "completed" or
                  run.get("head_branch") != "main" or
                  run.get("head_sha") != os.environ["EVIDENCE_COMMIT"] or
                  run.get("event") not in ("push", "workflow_dispatch")):
              raise SystemExit("evidence run must be a completed main-branch native run at the stated commit")
          jobs = json.loads((root / "evidence-jobs.json").read_text())
          expected_jobs = {
              "Full build / Windows x64", "Full build / Linux x64",
              "Full build / Linux ARM64", "Full build / macOS ARM64",
              "Full build / macOS Intel",
          }
          observed_jobs = {
              job.get("name"): job for job in jobs.get("jobs", [])
              if job.get("name") in expected_jobs
          }
          if (jobs.get("total_count") != len(jobs.get("jobs", [])) or
                  set(observed_jobs) != expected_jobs or
                  any(job.get("status") != "completed" or
                      job.get("conclusion") != "success"
                      for job in observed_jobs.values())):
              raise SystemExit("evidence run lacks five successful native build jobs")
          artifacts = json.loads((root / "evidence-artifacts.json").read_text())
          expected_artifacts = {
              "runner-evidence-windows-x64", "runner-evidence-linux-x64",
              "runner-evidence-linux-arm64", "runner-evidence-macos-arm64",
              "runner-evidence-macos-x64",
          }
          available_artifacts = {
              artifact.get("name") for artifact in artifacts.get("artifacts", [])
              if not artifact.get("expired")
          }
          if (artifacts.get("total_count") != len(artifacts.get("artifacts", [])) or
                  not expected_artifacts.issubset(available_artifacts)):
              raise SystemExit("evidence run lacks unexpired runner evidence for all five targets")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"source_event={run['event']}\n")
          PY
            exit 0
          fi
          if [[ -z "$EVIDENCE_COMMIT" && -z "$EVIDENCE_RUN_ID" && \
                "${{ needs.clean-build.result }}" == "success" ]]; then
            echo "source_event=$GITHUB_EVENT_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Both evidence_run_id and evidence_commit are required for proof-only mode." >&2
          exit 1

      - name: Download this run's native evidence
        uses: actions/download-artifact@v4
        with:
          pattern: runner-evidence-*
          path: hosted-inputs
          merge-multiple: true
          run-id: ${{ inputs.evidence_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Generate proof records from this completed five-target run
        env:
          EVIDENCE_COMMIT: ${{ inputs.evidence_commit }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          SOURCE_EVENT: ${{ steps.source-selection.outputs.source_event }}
        run: |
          source_commit="${EVIDENCE_COMMIT:-$GITHUB_SHA}"
          source_run_id="${EVIDENCE_RUN_ID:-$GITHUB_RUN_ID}"
          python ci/test/interface1-wait/write-proof.py \
            --commit "$source_commit" --driver-commit "$GITHUB_SHA" \
            --run-id "$source_run_id" \
            --branch "$GITHUB_REF_NAME" --event "$SOURCE_EVENT" \
            --input-dir hosted-inputs
          python ci/test/performance/write-proof.py \
            --commit "$source_commit" --driver-commit "$GITHUB_SHA" \
            --run-id "$source_run_id" \
            --branch "$GITHUB_REF_NAME" --event "$SOURCE_EVENT" \
            --input-dir hosted-inputs
          python ci/test/debugger-monitor-jump/write-proof.py \
            --commit "$source_commit" --driver-commit "$GITHUB_SHA" \
            --run-id "$source_run_id" \
            --branch "$GITHUB_REF_NAME" --event "$SOURCE_EVENT" \
            --input-dir hosted-inputs
          python ci/test/debugger-monitor-tabulate/write-proof.py \
            --commit "$source_commit" --driver-commit "$GITHUB_SHA" \
            --run-id "$source_run_id" \
            --branch "$GITHUB_REF_NAME" --event "$SOURCE_EVENT" \
            --input-dir hosted-inputs
          if [[ "$SOURCE_EVENT" == "workflow_dispatch" ]]; then
            python ci/test/ay-timing/write-proof.py \
              --commit "$source_commit" --driver-commit "$GITHUB_SHA" \
              --run-id "$source_run_id" \
              --branch "$GITHUB_REF_NAME" --event "$SOURCE_EVENT" \
              --input-dir hosted-inputs
            python ci/test/screenshot-state-time/write-proof.py \
              --commit "$source_commit" --driver-commit "$GITHUB_SHA" \
              --run-id "$source_run_id" \
              --branch "$GITHUB_REF_NAME" --event "$SOURCE_EVENT" \
              --input-dir hosted-inputs
          fi

      - name: Verify generated proof records
        env:
          SOURCE_EVENT: ${{ steps.source-selection.outputs.source_event }}
        shell: bash
        run: |
          test -s test-results/interface1-wait.json
          test -s test-results/phase16-performance-current.json
          test -s test-results/debugger-monitor-exit-contract.json
          test -s test-results/debugger-monitor-find-contract.json
          test -s test-results/debugger-monitor-step-contract.json
          test -s test-results/debugger-monitor-jump-contract.json
          test -s test-results/debugger-monitor-tabulate-contract.json
          compgen -G 'test-results/performance-current/*.json' > /dev/null
          if [[ "$SOURCE_EVENT" == "workflow_dispatch" ]]; then
            test -s test-results/ay-timing-contract.json
            test -s test-results/screenshot-state-time.json
          fi

      - name: Upload temporary proof records
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: phase16-wait-evidence-${{ github.run_id }}
          path: |
            test-results/interface1-wait.json
            test-results/phase16-performance-current.json
            test-results/debugger-monitor-exit-contract.json
            test-results/debugger-monitor-find-contract.json
            test-results/debugger-monitor-step-contract.json
            test-results/debugger-monitor-jump-contract.json
            test-results/debugger-monitor-tabulate-contract.json
            test-results/performance-current/*.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload temporary proof records for dispatch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: phase16-wait-evidence-${{ github.run_id }}
          path: |
            test-results/interface1-wait.json
            test-results/phase16-performance-current.json
            test-results/debugger-monitor-exit-contract.json
            test-results/debugger-monitor-find-contract.json
            test-results/debugger-monitor-step-contract.json
            test-results/debugger-monitor-jump-contract.json
            test-results/debugger-monitor-tabulate-contract.json
            test-results/performance-current/*.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload dispatch-only timing and screenshot records
        if: github.event_name == 'workflow_dispatch' && steps.source-selection.outputs.source_event == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: phase16-dispatch-only-evidence-${{ github.run_id }}
          path: |
            test-results/ay-timing-contract.json
            test-results/screenshot-state-time.json
          if-no-files-found: error
          retention-days: 1
