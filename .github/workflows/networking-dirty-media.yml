name: Networking dirty Microdrive resolution contract

on:
  push:
    branches: [main]
    paths:
      - 'src/**/*.c'
      - 'src/**/*.h'
      - 'src/**/*.m'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  networking-dirty-media:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact main revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Configure dirty-media integration contract
        run: cmake -S ci/test/networking-dirty-media -B dist/networking-dirty-media -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build dirty-media integration contract
        run: cmake --build dist/networking-dirty-media --config Release --target wz_networking_dirty_media_contract --parallel 2
      - name: Run dirty-media integration contract
        run: dist/networking-dirty-media/wz_networking_dirty_media_contract > dist/networking-dirty-media/run.log
      - name: Write source-pinned proof
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          python3 ci/test/networking-dirty-media/write-proof.py \
            --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --runner "$RUNNER_OS/$RUNNER_ARCH" \
            --run-log dist/networking-dirty-media/run.log \
            --proof dist/networking-dirty-media/networking-dirty-media.json
      - name: Upload source-pinned proof
        uses: actions/upload-artifact@v4
        with:
          name: networking-dirty-media-${{ github.sha }}
          path: dist/networking-dirty-media/networking-dirty-media.json
          if-no-files-found: error
