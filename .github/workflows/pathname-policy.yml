name: Repository pathname policy

on:
  # Direct commits to main are the only supported project update path.
  push:
    branches: [main]
  # Manual audits are also restricted to main by the guard below.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pathname-policy:
    name: Main pathname policy
    runs-on: ubuntu-latest
    steps:
      - name: Require a direct main push or main dispatch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" || ( "$GITHUB_EVENT_NAME" != "push" && "$GITHUB_EVENT_NAME" != "workflow_dispatch" ) ]]; then
            echo "Pathname policy runs only for direct pushes to main or manual dispatch on main." >&2
            exit 1
          fi

      - name: Check out repository tree
        uses: actions/checkout@v5
        with:
          # Pin the audited tree to the exact commit that triggered this run.
          ref: ${{ github.sha }}

      - name: Validate every tracked pathname at the pushed commit
        shell: bash
        run: python3 ci/validate-pathnames.py "$GITHUB_SHA"
