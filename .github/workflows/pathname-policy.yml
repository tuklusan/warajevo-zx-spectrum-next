name: Repository pathname policy

on:
  # Run after every direct update to the sole project branch.
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pathname-policy:
    name: Main pathname policy
    runs-on: ubuntu-latest
    steps:
      - name: Require a push to main
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" || "$GITHUB_EVENT_NAME" != "push" ]]; then
            echo "Pathname policy runs only after pushes to main." >&2
            exit 1
          fi

      - name: Check out repository tree
        uses: actions/checkout@v5
        with:
          # Pin the audited tree to the exact commit that triggered this run.
          ref: ${{ github.sha }}

      - name: Validate every tracked pathname at the pushed commit
        shell: bash
        run: python3 ci/validate-pathnames.py "$GITHUB_SHA"
