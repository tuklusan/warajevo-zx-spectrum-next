name: Open Run native media selection

on:
  push:
    branches: [main]
    paths:
      - 'src/**/*.c'
      - 'src/**/*.h'
      - 'src/**/*.m'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  open-run:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x86_64
            label: windows-2025
          - id: windows-arm64
            label: windows-11-arm
          - id: macos-x86_64
            label: macos-15-intel
          - id: macos-arm64
            label: macos-15
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.label }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        id: bootstrap
        with:
          path: ci/.runner-bootstrap-cache
          key: runner-bootstrap-${{ matrix.id }}-${{ hashFiles('ci/runner-bootstrap/manifests/**', 'ci/runner-bootstrap/**') }}
      - name: Bootstrap Windows runner
        if: runner.os == 'Windows' && steps.bootstrap.outputs.cache-hit != 'true'
        shell: pwsh
        run: .\ci\runner-bootstrap\bootstrap-windows.ps1 ci\runner-bootstrap\manifests\${{ matrix.id }}.txt
      - name: Bootstrap macOS runner
        if: runner.os == 'macOS' && steps.bootstrap.outputs.cache-hit != 'true'
        shell: bash
        run: bash ci/runner-bootstrap/bootstrap-unix.sh ci/runner-bootstrap/manifests/${{ matrix.id }}.txt
      - name: Record bootstrap identity
        if: steps.bootstrap.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p ci/.runner-bootstrap-cache
          printf 'runner_label=%s\nrunner_name=%s\nrunner_arch=%s\nimage=%s\nmanifest=ci/runner-bootstrap/manifests/%s.txt\nrecorded_at=%s\n' \
            '${{ matrix.label }}' "$RUNNER_NAME" "$RUNNER_ARCH" "${ImageOS:-unknown}" \
            '${{ matrix.id }}' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > ci/.runner-bootstrap-cache/manifest.txt
      - name: Build product GUI
        shell: bash
        run: |
          cmake -S src/cmake -B dist/open-run/${{ matrix.id }} -G Ninja -DCMAKE_BUILD_TYPE=Release -DWZSN_BUILD_SOKOL_HOST=ON
          cmake --build dist/open-run/${{ matrix.id }} --clean-first --parallel 2
      - name: Allow the app listener through the ephemeral runner firewall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = Join-Path $env:GITHUB_WORKSPACE 'dist/open-run/${{ matrix.id }}/Warajevo-ZX-Spectrum-Next.exe'
          if (-not (Test-Path -LiteralPath $binary)) { throw 'The production GUI binary is missing.' }
          Set-NetFirewallProfile -Profile Domain,Private,Public -NotifyOnListen 'False'
          New-NetFirewallRule -DisplayName 'WZSN temporary Open Run gate' -Direction Inbound -Action Allow -Program $binary -Profile Any | Out-Null
      - name: Clear first-logon overlays on the Windows ARM runner
        if: matrix.id == 'windows-arm64'
        shell: pwsh
        run: |
          $policy = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\OOBE'
          New-Item -Path $policy -Force | Out-Null
          New-ItemProperty -Path $policy -Name DisablePrivacyExperience -PropertyType DWord -Value 1 -Force | Out-Null
          Get-Process -Name wsl,WindowsTerminal -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          $keyboard = New-Object -ComObject WScript.Shell
          1..5 | ForEach-Object {
            $keyboard.SendKeys('{ENTER}')
            Start-Sleep -Seconds 2
            Get-Process -Name wsl,WindowsTerminal -ErrorAction SilentlyContinue |
              Stop-Process -Force -ErrorAction SilentlyContinue
          }
          Get-Process -Name wsl,WindowsTerminal -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          $keyboard.SendKeys('{ESC}')
          Start-Sleep -Seconds 1
          Get-Process -Name wsl,WindowsTerminal -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name msoobe,UserOOBEBroker,CloudExperienceHostBroker -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          $overlay = Get-Process -Name msoobe,UserOOBEBroker,CloudExperienceHostBroker -ErrorAction SilentlyContinue
          if ($overlay) { throw "Windows first-logon overlay remains: $($overlay.Name -join ', ')" }
          $wslServices = Get-Service -Name WslService,LxssManager -ErrorAction SilentlyContinue
          if ($wslServices) {
            $wslServices | Stop-Service -Force -ErrorAction SilentlyContinue
            $wslServices | Set-Service -StartupType Disabled
          }
          Get-Process -Name wsl,WindowsTerminal -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
      - name: Exercise keyboard entry, native chooser, and media load
        shell: bash
        run: |
          set -euo pipefail
          binary="dist/open-run/${{ matrix.id }}/Warajevo-ZX-Spectrum-Next"
          if [ -f "${binary}.exe" ]; then binary="${binary}.exe"; fi
          test -f "$binary"
          python ci/test/open-run-ui/open-run-ui.py "$binary" dist/open-run/${{ matrix.id }}/evidence
      - name: Pin source and screenshot evidence
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: python ci/test/open-run-ui/write-proof.py --output dist/open-run/${{ matrix.id }}/evidence
      - name: Remove temporary Windows firewall rule
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: Remove-NetFirewallRule -DisplayName 'WZSN temporary Open Run gate' -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: open-run-ui-${{ matrix.id }}-${{ github.sha }}
          path: dist/open-run/${{ matrix.id }}/evidence/
          if-no-files-found: warn
          retention-days: 1
