name: Project-owned indexed displacement load acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  indexed-load:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Configure indexed load acceptance
        run: cmake -S ci/test/cpu-indexed-load -B dist/cpu-indexed-load -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build indexed load acceptance
        run: cmake --build dist/cpu-indexed-load --target wz_cpu_indexed_load --parallel 2
      - name: Check indexed displacement state bus and trace
        run: |
          set -o pipefail
          dist/cpu-indexed-load/wz_cpu_indexed_load | tee dist/cpu-indexed-load/proof.json
      - name: Upload proof
        uses: actions/upload-artifact@v4
        with:
          name: cpu-indexed-load-proof
          path: dist/cpu-indexed-load/proof.json
          if-no-files-found: error
