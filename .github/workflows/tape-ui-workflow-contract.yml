name: Tape UI workflow contract

on:
  push:
    branches: [main]
    paths:
      - 'src/app/wz_tape_insert_action.*'
      - 'src/app/wz_tape_media_commands.*'
      - 'src/app/wz_sokol_main.c'
      - 'src/cmake/CMakeLists.txt'
      - 'ci/test/tape-ui-workflow-contract/**'
      - 'test-drivers/tape-ui-workflow-contract.driver.json'
      - '.github/workflows/tape-ui-workflow-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Ubuntu x64
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Configure contract
        run: cmake -S ci/test/tape-ui-workflow-contract -B dist/tape-ui-workflow-contract -DCMAKE_BUILD_TYPE=Release
      - name: Build and run contract
        run: |
          cmake --build dist/tape-ui-workflow-contract --config Release --target wz_tape_ui_workflow_contract --parallel 2
          ctest --test-dir dist/tape-ui-workflow-contract -C Release -R '^wz_tape_ui_workflow_contract$' --output-on-failure
      - name: Record hosted proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib, platform
          driver = json.loads(pathlib.Path('test-drivers/tape-ui-workflow-contract.driver.json').read_text())
          fixtures = []
          for item in driver['fixtures']:
              path = pathlib.Path(item['path'])
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest != item['sha256']:
                  raise SystemExit(f"fixture hash mismatch: {item['path']}")
              fixtures.append({'path': item['path'], 'sha256': digest})
          output = pathlib.Path('dist/tape-ui-workflow-contract/proof/tape-ui-workflow-contract.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps({'testId': driver['testId'], 'status': 'pass', 'commit': os.environ['GITHUB_SHA'], 'runner': f"{platform.system()}/{platform.machine()}", 'timestamp': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'runId': int(os.environ['GITHUB_RUN_ID']), 'fixtures': fixtures}, indent=2) + '\n')
          PY
      - name: Upload hosted proof
        uses: actions/upload-artifact@v4
        with:
          name: tape-ui-workflow-contract-${{ github.sha }}
          path: dist/tape-ui-workflow-contract/proof/tape-ui-workflow-contract.json
          if-no-files-found: error
