name: GUI Tape formats

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tape-formats:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Install desktop and OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev libasound2-dev libgl1-mesa-dev \
            libxi-dev libxcursor-dev xvfb xdotool imagemagick tesseract-ocr python3-pil
      - name: Build production desktop host
        run: |
          cmake -S src/cmake -B dist/gui-tape-formats/product -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DWZSN_BUILD_SOKOL_HOST=ON
          cmake --build dist/gui-tape-formats/product --config Release \
            --target wz_sokol_host --parallel 2
      - name: Exercise TZX and WAV presentation
        run: |
          xvfb-run -a python3 ci/test/gui-tape-formats.py \
            --binary dist/gui-tape-formats/product/Warajevo-ZX-Spectrum-Next \
            --rom roms/48.rom \
            --proof dist/gui-tape-formats/proof.json
      - name: Upload proof and captures
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gui-tape-formats-proof
          path: |
            dist/gui-tape-formats/proof.json
            dist/gui-tape-formats/*-initial.png
            dist/gui-tape-formats/*-mounted.png
            dist/gui-tape-formats/*-manager.png
          if-no-files-found: error
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gui-tape-formats-diagnostic
          path: |
            dist/gui-tape-formats/*.png
            dist/gui-tape-formats/*-application.log
          if-no-files-found: warn
