name: UI fixed menu action IDs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-menu-actions:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev libasound2-dev libgl1-mesa-dev \
            libxi-dev libxcursor-dev xvfb
      - name: Build production desktop host
        run: |
          cmake -S src/cmake -B dist/ui-menu-action-ids/product -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DWZSN_BUILD_SOKOL_HOST=ON
          cmake --build dist/ui-menu-action-ids/product --config Release \
            --target wz_sokol_host --parallel 2
      - name: Verify fixed actions through the production registry
        run: |
          xvfb-run -a python3 ci/test/ui-menu-action-ids.py \
            --binary dist/ui-menu-action-ids/product/Warajevo-ZX-Spectrum-Next \
            --rom roms/48.rom \
            --proof dist/ui-menu-action-ids/proof.json
      - name: Upload proof
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ui-menu-action-ids-proof
          path: dist/ui-menu-action-ids/proof.json
          if-no-files-found: error
          retention-days: 1
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-menu-action-ids-diagnostic
          path: dist/ui-menu-action-ids/product/**/CMakeFiles/CMakeOutput.log
          if-no-files-found: ignore
          retention-days: 1
