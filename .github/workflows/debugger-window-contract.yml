name: Debugger window shared-machine regression

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/debugger-window-contract.yml'
      - 'ci/test/debugger-window-contract/**'
      - 'src/app/wz_debugger_window.*'
      - 'src/app/wz_command_registry.*'
      - 'src/app/wz_host_thread.*'
      - 'src/core/wz_debugger.*'
      - 'src/cmake/CMakeLists.txt'
      - 'test-drivers/debugger-window-contract.driver.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debugger-window-contract:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact main revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Configure contract
        run: cmake -S ci/test/debugger-window-contract -B dist/debugger-window-contract -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build contract
        run: cmake --build dist/debugger-window-contract --config Release --target wz_debugger_window_contract --parallel 2
      - name: Run contract
        run: ctest --test-dir dist/debugger-window-contract --output-on-failure --verbose -R '^wz_debugger_window_contract$'
      - name: Write pinned proof
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          python3 ci/test/debugger-window-contract/write-proof.py \
            --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --runner "$RUNNER_OS/$RUNNER_ARCH" \
            --proof dist/debugger-window-contract/debugger-window-contract.json
      - name: Upload pinned proof
        uses: actions/upload-artifact@v4
        with:
          name: debugger-window-contract-${{ github.sha }}
          path: dist/debugger-window-contract/debugger-window-contract.json
          if-no-files-found: error
