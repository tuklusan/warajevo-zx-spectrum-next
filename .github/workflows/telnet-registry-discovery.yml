name: Telnet registry discovery regression

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/telnet-registry-discovery.yml'
      - 'ci/test/telnet-registry-discovery/**'
      - 'src/app/wz_command_registry.*'
      - 'src/app/wz_host_thread.*'
      - 'src/app/wz_host_output.*'
      - 'src/app/wz_screenshot_service.*'
      - 'src/app/wz_speed_policy.*'
      - 'src/app/wz_telnet_keyboard_command.*'
      - 'src/app/wz_telnet_keymap.*'
      - 'src/core/**'
      - 'test-drivers/telnet-registry-discovery.driver.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            label: Windows Intel
            runner: windows-2025
          - id: windows-arm64
            label: Windows ARM64
            runner: windows-11-arm
          - id: macos-x64
            label: macOS Intel
            runner: macos-15-intel
          - id: macos-arm64
            label: macOS ARM64
            runner: macos-15
    name: Discovery ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Configure regression
        run: cmake -S ci/test/telnet-registry-discovery -B dist/telnet-registry-discovery -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build regression
        run: cmake --build dist/telnet-registry-discovery --config Release --target wz_telnet_registry_discovery --parallel 2

      - name: Run regression and save runner result
        shell: bash
        env:
          MATRIX_ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          executable=dist/telnet-registry-discovery/wz_telnet_registry_discovery
          if [[ "$RUNNER_OS" == "Windows" ]]; then executable="$executable.exe"; fi
          result_dir="dist/telnet-registry/results/$MATRIX_ID"
          mkdir -p "$result_dir"
          "$executable" | tee "$result_dir/run.log"
          python - <<'PY'
          import json, os
          from pathlib import Path
          record = {
              "id": os.environ["MATRIX_ID"],
              "os": os.environ["RUNNER_OS"],
              "architecture": os.environ["RUNNER_ARCH"],
              "runnerName": os.environ.get("ImageOS", "hosted runner"),
          }
          Path(f"dist/telnet-registry/results/{record['id']}/runner.json").write_text(
              json.dumps(record, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload runner result
        uses: actions/upload-artifact@v4
        with:
          name: telnet-registry-raw-${{ matrix.id }}
          path: dist/telnet-registry/results/
          if-no-files-found: error

  proof:
    if: github.ref == 'refs/heads/main'
    needs: regression
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Download runner results
        uses: actions/download-artifact@v4
        with:
          pattern: telnet-registry-raw-*
          path: dist/telnet-registry/artifacts
          merge-multiple: true

      - name: Validate and write pinned proof
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python3 ci/test/telnet-registry-discovery/write-proof.py \
            --project-commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --artifact-root dist/telnet-registry/artifacts \
            --proof-out dist/telnet-registry/telnet-registry-discovery.json

      - name: Upload pinned proof
        uses: actions/upload-artifact@v4
        with:
          name: telnet-registry-discovery-proof-${{ github.sha }}
          path: dist/telnet-registry/telnet-registry-discovery.json
          if-no-files-found: error
