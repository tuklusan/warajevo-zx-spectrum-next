name: GUI Tape actions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tape-actions:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Install desktop and OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev libasound2-dev libgl1-mesa-dev \
            libxi-dev libxcursor-dev xvfb xdotool imagemagick tesseract-ocr python3-pil
      - name: Build production desktop host
        run: |
          cmake -S src/cmake -B dist/gui-tape-actions/product -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DWZSN_BUILD_SOKOL_HOST=ON
          cmake --build dist/gui-tape-actions/product --config Release \
            --target wz_sokol_host --parallel 2
      - name: Exercise Tape actions through the GUI
        run: |
          xvfb-run -a python3 ci/test/gui-tape-actions.py \
            --binary dist/gui-tape-actions/product/Warajevo-ZX-Spectrum-Next \
            --rom roms/48.rom \
            --proof dist/gui-tape-actions/proof.json
      - name: Upload proof and captures
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gui-tape-actions-proof
          path: |
            dist/gui-tape-actions/proof.json
            dist/gui-tape-actions/initial.png
            dist/gui-tape-actions/mounted.png
            dist/gui-tape-actions/manager.png
            dist/gui-tape-actions/ejected.png
          if-no-files-found: error
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gui-tape-actions-diagnostic
          path: |
            dist/gui-tape-actions/*.png
            dist/gui-tape-actions/application-diagnostic.log
          if-no-files-found: warn
