name: UI required command actions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  required-command-actions:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev libasound2-dev libgl1-mesa-dev \
            libxi-dev libxcursor-dev xvfb xdotool imagemagick python3-pil \
            tesseract-ocr
      - name: Build production desktop host
        run: |
          cmake -S src/cmake -B dist/ui-required-command-actions/product -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DWZSN_BUILD_SOKOL_HOST=ON
          cmake --build dist/ui-required-command-actions/product --config Release \
            --target wz_sokol_host --parallel 2
      - name: Verify canonical actions through the production command registry
        run: |
          xvfb-run -a python3 ci/test/ui-required-command-actions.py \
            --binary dist/ui-required-command-actions/product/Warajevo-ZX-Spectrum-Next \
            --rom roms/48.rom \
            --proof dist/ui-required-command-actions/proof.json
      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-required-command-actions-proof
          path: |
            dist/ui-required-command-actions/proof.json
            dist/ui-required-command-actions/telnet-settings.png
            dist/ui-required-command-actions/telnet-settings-crop.png
          if-no-files-found: warn
          retention-days: 1
