name: GUI output failure state preservation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  output-failure:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev libasound2-dev libgl1-mesa-dev libxi-dev libxcursor-dev xvfb xdotool imagemagick
      - name: Build production desktop host
        run: |
          cmake -S src/cmake -B dist/gui-output-failure/product -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DWZSN_BUILD_SOKOL_HOST=ON
          cmake --build dist/gui-output-failure/product --config Release \
            --target wz_sokol_host --parallel 2
      - name: Exercise failed snapshot and PNG writes
        run: |
          xvfb-run -a python3 ci/test/gui-output-failure.py \
            --binary dist/gui-output-failure/product/Warajevo-ZX-Spectrum-Next \
            --rom roms/48.rom \
            --proof dist/gui-output-failure/proof.json
      - name: Upload aggregate proof
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gui-output-failure-proof
          path: dist/gui-output-failure/proof.json
          if-no-files-found: error
      - name: Upload diagnostic desktop on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gui-output-failure-diagnostic
          path: |
            dist/gui-output-failure/desktop-diagnostic.png
            dist/gui-output-failure/application-diagnostic.log
          if-no-files-found: warn
