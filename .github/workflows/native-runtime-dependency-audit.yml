name: Native runtime dependency audit

on:
  push:
    branches: [main]
    paths:
      - 'src/app/**'
      - 'src/core/**'
      - 'src/cmake/CMakeLists.txt'
      - 'ci/test/runtime-dependencies/**'
      - 'test-drivers/native-runtime-dependency-audit.driver.json'
      - '.github/workflows/native-runtime-dependency-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-native-build:
    name: Release dependency audit / ${{ matrix.id }}
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64
            runner: ubuntu-24.04
            architecture: x64
          - id: linux-arm64
            runner: ubuntu-24.04-arm
            architecture: arm64
          - id: macos-x64
            runner: macos-15-intel
            architecture: x64
          - id: macos-arm64
            runner: macos-15
            architecture: arm64
    steps:
      - name: Check out exact main revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Install Linux host development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev libgl-dev libgtk-3-dev libxcursor-dev libxi-dev libx11-dev pkg-config

      - name: Configure native Release application
        run: cmake -S src/cmake -B dist/native-runtime-${{ matrix.id }} -DCMAKE_BUILD_TYPE=Release -DWZSN_BUILD_SOKOL_HOST=ON

      - name: Build application executable
        run: cmake --build dist/native-runtime-${{ matrix.id }} --config Release --target wz_sokol_host --parallel 2

      - name: Inspect host dependencies
        env:
          RUNNER_ID: ${{ matrix.id }}
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          python3 ci/test/runtime-dependencies/inspect_runtime.py \
            --binary dist/native-runtime-${{ matrix.id }}/Warajevo-ZX-Spectrum-Next \
            --runner-id "$RUNNER_ID" \
            --expected-architecture "$EXPECTED_ARCHITECTURE" \
            --proof-out dist/native-runtime-${{ matrix.id }}/runner-proof.json

      - name: Upload runner report
        uses: actions/upload-artifact@v4
        with:
          name: native-runtime-${{ matrix.id }}
          path: dist/native-runtime-${{ matrix.id }}/runner-proof.json
          if-no-files-found: error
          retention-days: 90

  consolidate-proof:
    name: Pin four-platform dependency proof
    if: github.ref == 'refs/heads/main'
    needs: inspect-native-build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact main revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Download all runner reports
        uses: actions/download-artifact@v4
        with:
          pattern: native-runtime-*
          path: dist/native-runtime-reports

      - name: Consolidate pinned proof
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python3 ci/test/runtime-dependencies/write_matrix_proof.py \
            --driver test-drivers/native-runtime-dependency-audit.driver.json \
            --reports dist/native-runtime-reports \
            --proof-out dist/native-runtime-dependency-audit.json

      - name: Upload consolidated proof
        uses: actions/upload-artifact@v4
        with:
          name: native-runtime-dependency-audit-${{ github.sha }}
          path: dist/native-runtime-dependency-audit.json
          if-no-files-found: error
          retention-days: 90
