# The structured issue review is sufficient for the pre-push gate. Avoid a
# second model request for an optional prose summary.
summary_prompt = ""

[prompt_vars]
requirements = """
- Review only the changed source code in C, Python, and Z80 assembly.
- Prioritize correctness, memory safety, undefined behavior, portability,
  interrupt and hardware interaction issues, and regressions.
- Do not report documentation, formatting-only, or generated-file concerns.
- Report only Blocker, Critical, or Major issues. Ignore all lower-severity concerns.
- Keep feedback minimal: one issue per list item, with the file and line, the
  concrete failure, and the smallest actionable correction.
- Do not include praise, summaries, background, repeated explanations, or
  speculative concerns. Return an empty list when no qualifying issue exists.
"""

[pipeline_steps.jira]
enabled = false

[pipeline_steps.linear]
enabled = false
